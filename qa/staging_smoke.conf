{
  "_doc": "Per-repo REAL smoke for staging_smoke.py. STAGING ONLY - the script refuses any base URL that does not look like staging. No secret values live here: credentials come from env vars, state/qa_creds/<repo>.json (0600), or (iptv_apps only) the documented defaults inside iptv_apps scripts/e2e_janitor.py read via `git show` (never printed). Placeholders: {marker} = per-run unique id, {id}/{...} = values captured by the write step.",
  "defaults": {"timeout_s": 20, "deny_origin": "https://evil.example"},
  "repos": {
    "billwatch": {
      "health": {"path": "/health", "json_has": "status"},
      "login": {
        "kind": "form", "path": "/api/auth/login", "user_field": "username", "token_key": "access_token",
        "creds": {
          "email_env": "QA_SMOKE_BILLWATCH_EMAIL", "password_env": "QA_SMOKE_BILLWATCH_PASSWORD", "file": "billwatch",
          "auto_register": {"path": "/api/auth/register", "email": "qa-smoke@shrikelabs.dev", "body": {"display_name": "QA Smoke"}, "token_key": "access_token"}
        }
      },
      "business": [
        {"name": "bills search (public)", "path": "/api/bills?page_size=1", "auth": false, "json_has": "bills"},
        {"name": "topics (authenticated)", "path": "/api/topics", "auth": true, "json_type": "list"},
        {"name": "auth guard rejects anonymous", "path": "/api/auth/me", "auth": false, "expect_status": 401}
      ],
      "write_read": {
        "name": "update display_name then read it back",
        "write": {"method": "PATCH", "path": "/api/auth/me/settings", "body": {"display_name": "qa-smoke-{marker}"}},
        "read": {"path": "/api/auth/me", "expect_json_equals": {"display_name": "qa-smoke-{marker}"}}
      },
      "frontend": {"url": "https://billwatch.vercel.app", "contains": "_next/static", "note": "no staging frontend exists; this is the PROD frontend asset (curl load only)"},
      "cors": {"path": "/api/bills?page_size=1", "origins": ["https://billwatch.vercel.app", "https://billwatch.app"]}
    },
    "gitlark": {
      "health": {"path": "/health", "json_has": "status"},
      "login": {"kind": "none", "reason": "gitlark authenticates ONLY via GitHub OAuth (no password login, no test-account endpoint); set QA_SMOKE_GITLARK_TOKEN (a staging bearer token) to enable login-dependent steps", "token_env": "QA_SMOKE_GITLARK_TOKEN"},
      "api_prefix": "/api",
      "business": [
        {"name": "public snippet search", "path": "/api/snippets/search/public", "auth": false, "json_has": "items"},
        {"name": "trending snippets", "path": "/api/snippets/trending", "auth": false, "json_type": "list"},
        {"name": "auth guard rejects anonymous", "path": "/api/workspaces", "auth": false, "expect_status": 401}
      ],
      "write_read": {
        "name": "create snippet, read it back, delete it",
        "requires_token": true,
        "write": {"method": "POST", "path": "/api/snippets", "body": {"title": "qa-smoke-{marker}", "content": "print(1)", "language": "python", "is_public": false}, "capture": {"id": "id"}},
        "read": {"path": "/api/snippets/{id}", "expect_json_equals": {"title": "qa-smoke-{marker}"}},
        "cleanup": {"method": "DELETE", "path": "/api/snippets/{id}"}
      },
      "frontend": {"url": "https://gitlark.vercel.app", "contains": "GitLark", "note": "no staging frontend exists; this is the PROD frontend asset (curl load only)"},
      "cors": {"path": "/api/snippets/trending", "origins": ["https://gitlark.vercel.app"]}
    },
    "iptv_apps": {
      "health": {"path": "/health", "json_has": "status"},
      "login": {
        "kind": "json", "path": "/api/auth/login", "token_key": "access_token",
        "creds": {
          "email_env": "QA_SMOKE_CHICKADEE_EMAIL", "password_env": "QA_SMOKE_CHICKADEE_PASSWORD", "file": "iptv_apps",
          "repo_default": {"git_path": "scripts/e2e_janitor.py", "password_env_name": "E2E_STAGING_PREMIUM_PASSWORD", "also_env_names": ["E2E_STAGING_PREMIUM_PASSWORD"]}
        }
      },
      "business": [
        {"name": "subscription status (premium account)", "path": "/api/subscription/status", "auth": true, "json_type": "dict", "json_equals": {"is_premium": true, "status": "active"}},
        {"name": "streams list", "path": "/api/streams?limit=1", "auth": true, "json_any": true},
        {"name": "auth guard rejects anonymous", "path": "/api/streams", "auth": false, "expect_status": 401}
      ],
      "write_read": {
        "name": "create profile, read it back in the list, delete it",
        "write": {"method": "POST", "path": "/api/profiles", "body": {"name": "E2E smoke {marker}"}, "capture": {"id": "id"}},
        "read": {"path": "/api/profiles", "expect_in_list": {"field": "id", "value": "{id}"}},
        "cleanup": {"method": "DELETE", "path": "/api/profiles/{id}"}
      },
      "frontend": {"url": "https://chickadeestream.com", "contains": "Chickadee Streams", "note": "no staging frontend exists; this is the PROD frontend asset (curl load only)"},
      "cors": {"path": "/api/streams?limit=1", "origins": ["https://chickadeestream.com"]}
    }
  }
}
