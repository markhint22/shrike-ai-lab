# Shrike AI Lab - Local LLM Infrastructure
# Run: docker-compose up -d
# 
# Services:
#   - Ollama: Local LLM inference (port 11434)
#   - LiteLLM: Unified API proxy (port 4000)
#   - Open WebUI: Chat interface (port 3000)

services:
  # ===========================================
  # Ollama - Local LLM Inference Engine
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: shrike-ollama
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    # For NVIDIA GPU support (RTX 2080/2080 Ti)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ===========================================
  # LiteLLM - Unified API Proxy
  # Routes requests to local Ollama or cloud APIs
  # ===========================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: shrike-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./configs/litellm_config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-shrike-local}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    depends_on:
      - ollama
    restart: unless-stopped

  # ===========================================
  # llama.cpp DFlash Server (single active model)
  # OpenAI-compatible API for qwen-dflash-35B-A3B
  # ===========================================
  llama-dflash-35b:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: shrike-llama-dflash-35b
    volumes:
      - ./models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec /app/llama-server
        -m "${DFLASH_TARGET_MODEL:-/models/deepflash/Qwen3.6-35B-A3B-Q4_K_M.gguf}"
        -md "${DFLASH_DRAFT_MODEL:-/models/deepflash/dflash-Qwen3.6-35B-A3B-Q8_0.gguf}"
        --spec-type draft-dflash
        --spec-draft-n-max "${DFLASH_SPEC_DRAFT_N_MAX:-4}"
        --ctx-size "${DFLASH_CTX_SIZE:-16384}"
        --flash-attn "${DFLASH_FLASH_ATTN:-on}"
        --cache-type-k "${DFLASH_CACHE_TYPE_K:-q8_0}"
        --cache-type-v "${DFLASH_CACHE_TYPE_V:-q8_0}"
        --host 0.0.0.0
        --port 8080
        --alias "${DFLASH_MODEL_ALIAS:-qwen-dflash-35B-A3B}"
        ${DFLASH_CHAT_TEMPLATE_ARGS:-}
    ports:
      - "8081:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ===========================================
  # Open WebUI - Chat Interface
  # Access at http://localhost:3000
  # ===========================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: shrike-webui
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-shrike-local
      - WEBUI_AUTH=false  # Disable auth for local dev - only reachable via Tailscale anyway
      - ENABLE_OLLAMA_API=false
    depends_on:
      - litellm
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data:

# ===========================================
# Network for inter-service communication
# ===========================================
networks:
  default:
    name: shrike-ai-network
