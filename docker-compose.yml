# Shrike AI Lab - Local LLM Infrastructure
# Run: docker-compose up -d
# 
# Services:
#   - Ollama: Local LLM inference (port 11434)
#   - LiteLLM: Unified API proxy (port 4000)
#   - Open WebUI: Chat interface (port 3000)

services:
  # ===========================================
  # Ollama - Local LLM Inference Engine
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: shrike-ollama
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    # For NVIDIA GPU support (RTX 2080/2080 Ti)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ===========================================
  # LiteLLM - Unified API Proxy
  # Routes requests to local Ollama or cloud APIs
  # ===========================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: shrike-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./configs/litellm_config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-shrike-local}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    depends_on:
      - ollama
    restart: unless-stopped

  # ===========================================
  # llama.cpp DFlash Server (single active model)
  # OpenAI-compatible API for qwen-dflash-35B-A3B
  # ===========================================
  llama-dflash-35b:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: shrike-llama-dflash-35b
    volumes:
      - ./models:/models
    # GGML_CUDA_GRAPH_OPT=1 is part of the measured ~87 tok/s recipe (2026-08-26).
    environment:
      - GGML_CUDA_GRAPH_OPT=${DFLASH_GRAPH_OPT:-1}
    entrypoint: ["/bin/sh", "-c"]
    # Defaults below = the TUNED production config (Qwen3.8-27B @ 65K, full GPU
    # offload, q4_0 KV, built-in MTP spec-decode n8, batch 512/256). This drops
    # generation from the old 8.7 tok/s (256K ctx, no -ngl) to ~87 tok/s (9.9x)
    # at the same model/quality. DO NOT restore --ctx-size 262144 or drop -ngl:
    # the 256K KV reservation is what strangled the Gated-DeltaNet decode path.
    # DFLASH_SPEC_ARGS carries the whole spec block so MTP (no -md) and a separate
    # draft model (-md X --spec-type draft-dflash) are both expressible per model.
    command:
      - >
        exec /app/llama-server
        -m "${DFLASH_TARGET_MODEL:-/models/deepflash/Qwen3.8-27B-Q4_K_M.gguf}"
        -ngl "${DFLASH_NGL:-99}"
        --ctx-size "${DFLASH_CTX_SIZE:-65536}"
        --flash-attn "${DFLASH_FLASH_ATTN:-on}"
        --cache-type-k "${DFLASH_CACHE_TYPE_K:-q4_0}"
        --cache-type-v "${DFLASH_CACHE_TYPE_V:-q4_0}"
        --batch-size "${DFLASH_BATCH_SIZE:-512}"
        --ubatch-size "${DFLASH_UBATCH_SIZE:-256}"
        ${DFLASH_SPEC_ARGS:---spec-type draft-mtp --spec-draft-n-max 8}
        --host 0.0.0.0
        --port 8080
        --alias "${DFLASH_MODEL_ALIAS:-qwen-dflash-27B}"
        ${DFLASH_CHAT_TEMPLATE_ARGS:---chat-template-file /models/deepflash/fixed_template_qwen3.8.jinja}
    ports:
      - "8081:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ===========================================
  # Open WebUI - Chat Interface
  # Access at http://localhost:3000
  # ===========================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: shrike-webui
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-shrike-local
      - WEBUI_AUTH=false  # Disable auth for local dev - only reachable via Tailscale anyway
      - ENABLE_OLLAMA_API=false
    depends_on:
      - litellm
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data:

# ===========================================
# Network for inter-service communication
# ===========================================
networks:
  default:
    name: shrike-ai-network
