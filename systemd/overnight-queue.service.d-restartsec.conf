[Unit]
# 2026-09-30: each run_overnight pass exits and systemd restarts it (~57x/day). RestartSec 20->3 recovers ~16 min/day of idle time.
# StartLimitIntervalSec=0 because a faster restart would otherwise trip the default 5-starts-in-10s limit on an instant-crash loop and leave the unit permanently failed.
StartLimitIntervalSec=0

[Service]
RestartSec=3
