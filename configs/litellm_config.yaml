# LiteLLM Configuration
# Unified API for local + cloud LLMs
#
# Usage in your code:
#   from litellm import completion
#   response = completion(model="specpilot-local", messages=[...])
#
# Or via OpenAI-compatible API:
#   base_url = "http://localhost:4000"

model_list:
  # ===========================================
  # Local Models (Ollama) - No API cost
  # ===========================================
  
  # Primary coding model for SpecPilot
  - model_name: specpilot-local
    litellm_params:
      model: ollama/phi3:mini
      api_base: http://ollama:11434
    model_info:
      description: "Temporary fallback to Phi-3 Mini for local validation"
      max_tokens: 4096

  # General purpose local model
  - model_name: mistral-local
    litellm_params:
      model: ollama/mistral:7b-instruct
      api_base: http://ollama:11434
    model_info:
      description: "Mistral 7B - General purpose, good for analysis"
      max_tokens: 8192

  # Smaller, faster model for quick tasks
  - model_name: phi3-local
    litellm_params:
      model: ollama/phi3:mini
      api_base: http://ollama:11434
    model_info:
      description: "Phi-3 Mini - Fast model for simple tasks"
      max_tokens: 4096

  # Qwen Coder 32B for high-quality code generation
  - model_name: qwen-coder-32b-local
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://ollama:11434
    model_info:
      description: "Qwen2.5 Coder 32B - Large local coding model"
      max_tokens: 8192

  # Qwen Coder large model family currently available in Ollama
  - model_name: qwen-coder-30b-local
    litellm_params:
      model: ollama/qwen3-coder:30b
      api_base: http://ollama:11434
    model_info:
      description: "Qwen3 Coder 30B - Latest large Qwen coder family in Ollama"
      max_tokens: 8192

  # 35B-A3B is wired to llama.cpp speculative decoding service.
  - model_name: qwen-dflash-35B-A3B
    litellm_params:
      model: openai/qwen-dflash-35B-A3B
      api_base: http://llama-dflash-35b:8080/v1
      api_key: "sk-local"
      chat_template_kwargs:
        enable_thinking: false
    model_info:
      description: "Qwen DFlash 35B-A3B via llama.cpp speculative decoding"
      # 2026-08-13: real ctx-size raised to 131072 (from 16384) via
      # --flash-attn on + q8_0 KV cache quantization - capped below the
      # model's own 262144 native max because only ~75MB VRAM is free at
      # that size on this 24GB GPU, too risky for production.
      max_input_tokens: 131072
      max_tokens: 8192

  - model_name: qwen-dflash-27B
    litellm_params:
      model: openai/qwen-dflash-27B
      api_base: http://llama-dflash-35b:8080/v1
      api_key: "sk-local"
      # 2026-09-02: hardened coding-fleet sampling. LiteLLM injects these on
      # every request and OVERRIDES client/aider values (verified: a client
      # temperature=2.0 stayed deterministic), so this is the enforced control
      # point for temp/top_p/presence_penalty. top_k=20 and min_p=0.0 are set
      # on llama-server (docker-compose) since they are non-OpenAI params.
      # Non-thinking coder: low-temp determinism nudged off Qwen's repetition
      # zone + presence_penalty as the low-temp repetition guard.
      temperature: 0.4
      top_p: 0.9
      presence_penalty: 1.0
      chat_template_kwargs:
        enable_thinking: false
    model_info:
      description: "Qwen DFlash 27B via llama.cpp speculative decoding"
      # 2026-08-13: real ctx-size raised to 262144 (the model's own native
      # training ceiling, n_ctx_train) via --flash-attn on + q8_0 KV cache
      # quantization - ~1.2GB VRAM free at this size, comfortable margin.
      max_input_tokens: 55000
      max_tokens: 8192

  # 2026-08-13: added - previously missing entirely, which is why the first
  # activation attempt failed (litellm had no route for this model name).
  # Target: Qwen/Qwen3.5-9B (bartowski GGUF quant). Draft: a third-party
  # DFlash draft that was already present locally, verified compatible live.
  - model_name: qwen-dflash-9B
    litellm_params:
      model: openai/qwen-dflash-9B
      api_base: http://llama-dflash-35b:8080/v1
      api_key: "sk-local"
      chat_template_kwargs:
        enable_thinking: false
    model_info:
      description: "Qwen3.5 DFlash 9B via llama.cpp speculative decoding - much smaller model, much bigger safe context margin (~9.1GB VRAM free at 262144)"
      max_input_tokens: 55000
      max_tokens: 8192

  # 2026-09-02: A/B TRIAL alias for Qwen3-Coder-Next (80B MoE, 3B active).
  # Backend container `shrike-llama-coder-next` (port 8082 on host) is STOPPED
  # by default and is launched only via scripts/trial-coder-next.sh, which
  # stops the 27B fleet first (they can't share the 24GB GPU). This alias is
  # dormant until that container is up. See scripts/trial-coder-next.sh.
  - model_name: qwen-coder-next
    litellm_params:
      model: openai/qwen-coder-next
      api_base: http://shrike-llama-coder-next:8080/v1
      api_key: "sk-local"
      temperature: 1.0
    model_info:
      description: "Qwen3-Coder-Next 80B-A3B MoE (CPU expert offload) - A/B trial vs qwen-dflash-27B; backend normally stopped"
      max_input_tokens: 32000
      max_tokens: 8192

  # Larger model (uses CPU offloading with 64GB RAM)
  - model_name: codellama-13b-local
    litellm_params:
      model: ollama/codellama:13b-instruct
      api_base: http://ollama:11434
    model_info:
      description: "CodeLlama 13B - Higher quality, slower (CPU offload)"
      max_tokens: 4096

  # ===========================================
  # Cloud Models (Fallback) - API cost applies
  # ===========================================
  
  # Claude for complex reasoning (when local isn't enough)
  - model_name: claude-fallback
    litellm_params:
      model: claude-3-haiku-20240307
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Claude Haiku - Cloud fallback for complex tasks"
      max_tokens: 4096

  - model_name: claude-sonnet
    litellm_params:
      model: claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Claude Sonnet - High quality cloud model"
      max_tokens: 8192

# ===========================================
# Routing Configuration
# ===========================================
router_settings:
  routing_strategy: "simple-shuffle"  # or "least-busy", "latency-based"
  num_retries: 2
  timeout: 120

# ===========================================
# Rate Limits (protect cloud API costs)
# ===========================================
litellm_settings:
  success_callback: []
  failure_callback: []
  max_budget: 10.0  # Max $10/day on cloud APIs
  budget_duration: "1d"

general_settings:
  master_key: sk-shrike-local
